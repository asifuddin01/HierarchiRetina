[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchiretina"
version = "1.0.0"
description = "HierarchiRetina: a screening-segmentation-grading cascade for diabetic retinopathy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0,<1.1",
    "albumentations>=1.4,<1.5",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["hierarchiretina*"]
